name: CI - Dev Environment

on:
  push:
    branches:
      - 'main'
    paths:
      - 'backend/**'
      - '.github/workflows/ci-dev.yml'

env:
  # TODO(boilerplate): replace with your container registry path.
  IMAGE_REPO: asia-southeast2-docker.pkg.dev/<your-gcp-project>/<your-registry>/dev/backend-belajar-lintas-ronald

jobs:
  run-tests:
    name: Run tests
    uses: <your-org>/backend-belajar-lintas-ronald/.github/workflows/reusable-test.yml@main
    secrets:
      SECRETMANAGER_SECRET: ${{ secrets.STAGING_SECRETMANAGER_SECRET }}
      SSH_PRIVATE_KEY_PRIVATE_GO_MODULE: ${{ secrets.SSH_PRIVATE_KEY_PRIVATE_GO_MODULE }}
      WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  automation:
    name: QA Automation Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Trigger QA automation
        run: |
          curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.QA_AUTOMATION_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/${{ secrets.GIT_OWNER }}/${{ secrets.QA_AUTOMATION_REPO }}/actions/workflows/${{ secrets.QA_AUTOMATION_WORKFLOW }}/dispatches \
          -d '{"ref":"main","inputs":{"mark":"id"}}'      
  

  metadata:
    name: Extract Metadata
    runs-on: ubuntu-latest
    needs:
      - run-tests
    outputs:
      short_sha: ${{ steps.metadata.outputs.short_sha }}
      branch: ${{ steps.metadata.outputs.branch }}
      commit_message: ${{ steps.metadata.outputs.commit_message }}
    steps:
      - uses: actions/checkout@v3
      - id: metadata
        # TODO(boilerplate): wire to your org's metadata-extraction action.
        uses: <your-org>/<your-actions-repo>/extract-metadata@main

  slack-notification:
    name: Initiate Slack Notification
    runs-on: ubuntu-latest
    needs:
      - metadata
    outputs:
      message_id: ${{ steps.slack-notification-start.outputs.message_id }}
    steps:
      - uses: actions/checkout@v3
      # TODO(boilerplate): wire to your org's Slack-notification action (or replace with slackapi/slack-github-action).
      - uses: <your-org>/<your-actions-repo>/slack-pre-cd@main
        id: slack-notification-start
        with:
          bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          commit_message: ${{ needs.metadata.outputs.commit_message }}
          commit_message_url: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          build_image_status: ":loading:"
          env: "Prepare Test"
          repository: ${{ github.server_url }}/${{ github.repository }}
          workflow_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          author_name: ${{ github.event.commits[0].author.name }}
          author_email: ${{ github.event.commits[0].author.email }}

  build-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs:
      - slack-notification
      - metadata

    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v3

      - name: Login to GCR
        uses: docker/login-action@v2
        with:
          registry: asia-southeast2-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.STAGING_GAR_JSON_KEY }}

      - id: docker-push-tagged
        name: Tag Docker image and push to Google Artifact Registry
        uses: docker/build-push-action@v3
        with:
          file: Dockerfile
          push: true
          build-args: |
            ssh_prv_key=${{ secrets.SSH_PRIVATE_KEY_PRIVATE_GO_MODULE_ENCODED }}
          tags: |
            asia-southeast2-docker.pkg.dev/<your-gcp-project>/<your-registry>/dev/backend-belajar-lintas-ronald:${{ needs.metadata.outputs.short_sha }}

      # TODO(boilerplate): wire to your org's Slack-notification action (or replace with slackapi/slack-github-action).
      - uses: <your-org>/<your-actions-repo>/slack-pre-cd@main
        if: failure()
        with:
          bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          commit_message: ${{ needs.metadata.outputs.commit_message }}
          commit_message_url: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          color: "#ff1500"
          message_id: ${{ needs.slack-notification.outputs.message_id }}
          build_image_status: ":test-failure:"
          update_image_tag_status: ":yay-wait:"
          env: "Prepare Test"
          repository: ${{ github.server_url }}/${{ github.repository }}
          workflow_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          author_name: ${{ github.event.commits[0].author.name }}
          author_email: ${{ github.event.commits[0].author.email }}

  modify-env-manifest:
    name: Modify Env Repository Manifest
    runs-on: ubuntu-latest
    env:
      CI_COMMIT_MESSAGE: "[${{ github.event.repository.name }}] New commit tag from ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
      CI_COMMIT_AUTHOR_NAME: ${{ github.event.repository.name }}
      CI_COMMIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
    needs:
      - slack-notification
      - build-push
      - metadata

    steps:
      # TODO(boilerplate): wire to your org's Slack-notification action (or replace with slackapi/slack-github-action).
      - uses: <your-org>/<your-actions-repo>/slack-pre-cd@main
        with:
          bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          commit_message: ${{ needs.metadata.outputs.commit_message }}
          commit_message_url: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          color: "#6F42C1"
          message_id: ${{ needs.slack-notification.outputs.message_id }}
          build_image_status: ":partydeploy:"
          update_image_tag_status: ":loading:"
          env: "Prepare Test"
          repository: ${{ github.server_url }}/${{ github.repository }}
          workflow_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          author_name: ${{ github.event.commits[0].author.name }}
          author_email: ${{ github.event.commits[0].author.email }}
      # TODO(boilerplate): point to your GitOps repo (path/name) so deploys land in the right manifests.
      - uses: actions/checkout@v4
        with:
          repository: <your-org>/<your-gitops-repo>
          token: ${{ secrets.GH_PAT }}
          path: <your-gitops-repo>
          fetch-depth: 1
      - name: Update Image Version
        uses: fjogeleit/yaml-update-action@v0.13.2
        with:
          valueFile: 'backend-belajar-lintas-ronald/overlays/dev/patches/deployment-api-patch.yaml'
          repository: <your-org>/<your-gitops-repo>
          message: 'chore(deploy): [Dev] Update service (backend-belajar-lintas-ronald) image version to (${{ needs.metadata.outputs.short_sha }})'
          createPR: false
          branch: main
          targetBranch: main
          token: ${{ secrets.GH_PAT }}
          workDir: <your-gitops-repo>
          changes: |
            {
              "backend-belajar-lintas-ronald/overlays/dev/patches/deployment-api-patch.yaml": {
                "spec.template.spec.containers[0].image": "${{ env.IMAGE_REPO }}:${{ needs.metadata.outputs.short_sha }}",
                "metadata.labels['tags.datadoghq.com/version']": "${{ needs.metadata.outputs.short_sha }}",
                "spec.template.metadata.labels['tags.datadoghq.com/version']": "${{ needs.metadata.outputs.short_sha }}"
              },
              "backend-belajar-lintas-ronald/overlays/dev/patches/deployment-worker-patch.yaml": {
                "spec.template.spec.containers[0].image": "${{ env.IMAGE_REPO }}:${{ needs.metadata.outputs.short_sha }}"
              },
              "backend-belajar-lintas-ronald/overlays/dev/patches/job-patch.yaml": {
                "spec.template.spec.containers[0].image": "${{ env.IMAGE_REPO }}:${{ needs.metadata.outputs.short_sha }}"
              }
            }
      # TODO(boilerplate): wire to your org's Slack-notification action (or replace with slackapi/slack-github-action).
      - uses: <your-org>/<your-actions-repo>/slack-pre-cd@main
        if: failure()
        with:
          bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          commit_message: ${{ needs.metadata.outputs.commit_message }}
          commit_message_url: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          color: "#ff1500"
          message_id: ${{ needs.slack-notification.outputs.message_id }}
          build_image_status: ":partydeploy:"
          update_image_tag_status: ":test-failure:"
          env: "Prepare Test"
          repository: ${{ github.server_url }}/${{ github.repository }}
          workflow_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          author_name: ${{ github.event.commits[0].author.name }}
          author_email: ${{ github.event.commits[0].author.email }}

      # TODO(boilerplate): wire to your org's Slack-notification action (or replace with slackapi/slack-github-action).
      - uses: <your-org>/<your-actions-repo>/slack-pre-cd@main
        if: success()
        with:
          bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          commit_message: ${{ needs.metadata.outputs.commit_message }}
          commit_message_url: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          color: "#35A64F"
          message_id: ${{ needs.slack-notification.outputs.message_id }}
          build_image_status: ":partydeploy:"
          update_image_tag_status: ":partydeploy:"
          env: "Prepare Test"
          repository: ${{ github.server_url }}/${{ github.repository }}
          workflow_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          author_name: ${{ github.event.commits[0].author.name }}
          author_email: ${{ github.event.commits[0].author.email }}
