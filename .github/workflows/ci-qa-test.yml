name: ci-qa-test

on:
  push:
    branches: [main]
    paths:
      - 'qa-test/**'
      - '.github/workflows/ci-qa-test.yml'
  pull_request:
    paths:
      - 'qa-test/**'
      - '.github/workflows/ci-qa-test.yml'

jobs:
  static-checks:
    name: ruff + mypy + collect
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: qa-test/.python-version
          cache: 'pip'
          cache-dependency-path: qa-test/pyproject.toml

      - name: Install (editable + dev)
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy (strict)
        run: mypy framework pages tests

      - name: Pytest collect-only
        run: pytest --collect-only -q
