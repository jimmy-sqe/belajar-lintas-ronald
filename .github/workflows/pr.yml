name: Pull Request

on:
  pull_request:
    branches:
      - "**"
    paths:
      - 'backend/**'
      - '.github/workflows/pr.yml'

jobs:
  assign-author:
    name: Assign author to PR
    runs-on: ubuntu-latest
    steps:
      - name: Assign author to PR
        uses: technote-space/assign-author@v1

  run-tests:
    name: Run tests
    uses: <your-org>/backend-belajar-lintas-ronald/.github/workflows/reusable-test.yml@main
    secrets:
      SECRETMANAGER_SECRET: ${{ secrets.STAGING_SECRETMANAGER_SECRET }}
      SSH_PRIVATE_KEY_PRIVATE_GO_MODULE: ${{ secrets.SSH_PRIVATE_KEY_PRIVATE_GO_MODULE }}
      WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  automation:
    name: QA Automation Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Trigger QA automation
        run: |
            curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.QA_AUTOMATION_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ secrets.GIT_OWNER }}/${{ secrets.QA_AUTOMATION_REPO }}/actions/workflows/${{ secrets.QA_AUTOMATION_WORKFLOW }}/dispatches \
            -d '{"ref":"main","inputs":{"mark":"id"}}'      
