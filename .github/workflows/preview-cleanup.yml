name: PR Preview Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

jobs:
  cleanup:
    if: contains(github.event.pull_request.labels.*.name, 'preview-deployed')
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER_NAME }}
          location: ${{ secrets.GKE_CLUSTER_LOCATION }}

      - name: Helm uninstall + delete namespace
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          NS="preview-${REPO_NAME}-pr-${{ github.event.pull_request.number }}"
          RELEASE="preview-${REPO_NAME}-pr-${{ github.event.pull_request.number }}"

          if kubectl get namespace "$NS" &>/dev/null; then
            helm uninstall "$RELEASE" --namespace "$NS" --ignore-not-found || true
            kubectl delete namespace "$NS" --ignore-not-found

            # Wait up to 5min, then force-remove finalizers if stuck terminating
            for i in $(seq 1 60); do
              STATUS=$(kubectl get namespace "$NS" -o jsonpath='{.status.phase}' 2>/dev/null || echo "gone")
              if [ "$STATUS" = "gone" ] || [ -z "$STATUS" ]; then
                echo "Namespace $NS deleted"
                break
              fi
              if [ "$STATUS" = "Terminating" ] && [ "$i" -eq 60 ]; then
                echo "Namespace stuck terminating — forcing finalizer removal"
                kubectl get namespace "$NS" -o json \
                  | jq '.spec.finalizers = []' \
                  | kubectl replace --raw "/api/v1/namespaces/$NS/finalize" -f -
              fi
              sleep 5
            done
          else
            echo "Namespace $NS not found — nothing to clean"
          fi

      - name: Comment — cleaned up
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const repoName = '${{ github.event.repository.name }}';
            const prNum    = '${{ github.event.pull_request.number }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(prNum),
              body: `Preview environment \`preview-${repoName}-pr-${prNum}\` deleted.`,
            });
