name: PR Preview Deploy

on:
  issue_comment:
    types: [created]

# Triggers on /preview comment from OWNER/MEMBER/COLLABORATOR on a PR.
# Non-matching comments skip instantly.

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write  # required for Workload Identity Federation

jobs:
  deploy-preview:
    if: |
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/preview' &&
      contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest

    steps:
      # ── 1. Get PR metadata ─────────────────────────────────────────────────
      - name: Get PR info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('sha', pr.data.head.sha);
            core.setOutput('ref', pr.data.head.ref);
            core.setOutput('number', String(context.issue.number));

      - name: React — eyes (ack)
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      # ── 2. Set preview env vars ────────────────────────────────────────────
      - name: Set preview vars
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          PR_NUM="${{ steps.pr.outputs.number }}"
          echo "RELEASE_NAME=preview-${REPO_NAME}-pr-${PR_NUM}" >> $GITHUB_ENV
          echo "NAMESPACE=preview-${REPO_NAME}-pr-${PR_NUM}" >> $GITHUB_ENV
          echo "REPO_NAME=${REPO_NAME}" >> $GITHUB_ENV

      # ── 3. Checkout PR branch ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}

      # ── 4. Auth to GCP via Workload Identity Federation ───────────────────
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      # ── 5. Build & push images ─────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.AR_REGION }}-docker.pkg.dev --quiet

      - name: Build backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true
          tags: ${{ secrets.AR_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/preview/${{ env.REPO_NAME }}/backend:${{ steps.pr.outputs.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          load: true
          tags: ${{ secrets.AR_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/preview/${{ env.REPO_NAME }}/frontend:${{ steps.pr.outputs.sha }}
          build-args: |
            HORIZON_KEY=${{ secrets.HORIZON_KEY }}
            NEXT_PUBLIC_BACKEND_URL=https://${{ env.REPO_NAME }}-pr-${{ steps.pr.outputs.number }}-api.preview.squantumengine.com
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # Push only after both builds succeed
      - name: Push images
        run: |
          AR="${{ secrets.AR_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/preview/${{ env.REPO_NAME }}"
          SHA="${{ steps.pr.outputs.sha }}"
          docker push ${AR}/backend:${SHA}
          docker push ${AR}/frontend:${SHA}

      # ── 6. Deploy to GKE ───────────────────────────────────────────────────
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER_NAME }}
          location: ${{ secrets.GKE_CLUSTER_LOCATION }}

      - name: Helm deploy
        run: |
          helm upgrade --install \
            ${{ env.RELEASE_NAME }} \
            ./helm/preview \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --set-string pr.number=${{ steps.pr.outputs.number }} \
            --set-string pr.sha=${{ steps.pr.outputs.sha }} \
            --set-string repoName=${{ env.REPO_NAME }} \
            --set registry=${{ secrets.AR_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/preview \
            --set postgresql.password=${{ secrets.PREVIEW_DB_PASSWORD }} \
            --force \
            --wait \
            --timeout 5m

      # ── 7. Label PR so cleanup knows preview was deployed ─────────────────
      - name: Label PR — preview-deployed
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr.outputs.number }},
              labels: ['preview-deployed'],
            });

      # ── 8. Post result comment ──────────────────────────────────────────────
      - name: Comment — deployed
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const prNum  = '${{ steps.pr.outputs.number }}';
            const sha    = '${{ steps.pr.outputs.sha }}'.slice(0, 7);
            const repo   = '${{ env.REPO_NAME }}';
            const domain = 'preview.squantumengine.com';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(prNum),
              body: [
                '## Preview deployed',
                '',
                `| | |`,
                `|---|---|`,
                `| **App** | https://${repo}-pr-${prNum}.${domain} |`,
                `| **API** | https://${repo}-pr-${prNum}-api.${domain}/healthz |`,
                `| **SHA** | \`${sha}\` |`,
                '',
                '_DB migration runs as a post-deploy Job — allow ~1 min for data to appear._',
              ].join('\n'),
            });

      - name: React — rocket (success)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - name: React — confused (failure)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'confused',
            });
