openapi: 3.0.3
info:
  title: backend-belajar-lintas-ronald API
  description: API contract for the backend-belajar-lintas-ronald service (TodoApp preview-env).
  version: 0.3.0

servers:
  - url: http://localhost:8000

paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: getHealthz
      responses:
        '200':
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /v1/auth/login:
    post:
      summary: Sign in with email + password
      operationId: postAuthLogin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '201':
          description: Logged in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginResponse' }
        '422': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/auth/logout:
    post:
      summary: Sign out (invalidate refresh token)
      operationId: postAuthLogout
      security: [ { bearerAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/auth/renew:
    post:
      summary: Renew access token using refresh token
      operationId: postAuthRenew
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenewRequest' }
      responses:
        '200':
          description: Renewed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RenewResponse' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/todos:
    get:
      summary: List todos owned by the authenticated user
      operationId: listTodos
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        '200':
          description: Paged list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/TodoResponse' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      summary: Create a todo
      operationId: createTodo
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTodoRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TodoResponse' }
        '422': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/todos/{id}:
    get:
      summary: Get todo by id
      operationId: getTodo
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TodoResponse' }
        '404': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
    put:
      summary: Update todo (partial)
      operationId: updateTodo
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTodoRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TodoResponse' }
        '422': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
    delete:
      summary: Delete todo
      operationId: deleteTodo
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }
        '404': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SuccessResponse:
      type: object
      required: [success, code, message, data, timestamp]
      properties:
        success: { type: boolean, example: true }
        code:    { type: integer, example: 200 }
        message: { type: string }
        data:    { type: object }
        timestamp: { type: string, format: date-time }

    PaginatedResponse:
      type: object
      required: [success, code, message, data, pagination, timestamp]
      properties:
        success: { type: boolean, example: true }
        code:    { type: integer, example: 200 }
        message: { type: string }
        data:    { type: array, items: {} }
        pagination: { $ref: '#/components/schemas/Pagination' }
        timestamp: { type: string, format: date-time }

    Pagination:
      type: object
      required: [page, page_size, total_data, total_page]
      properties:
        page:       { type: integer, minimum: 1, example: 1 }
        page_size:  { type: integer, minimum: 1, example: 10 }
        total_data: { type: integer, minimum: 0, example: 5 }
        total_page: { type: integer, minimum: 0, example: 1 }

    ErrorResponse:
      type: object
      required: [success, code, message, timestamp]
      properties:
        success: { type: boolean, example: false }
        code:    { type: integer, example: 40400, description: "5-digit numeric error code" }
        message: { type: string }
        timestamp: { type: string, format: date-time }
        metadata:
          type: object
          additionalProperties: true

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }

    LoginResponse:
      type: object
      properties:
        access_token:                   { type: string }
        refresh_token:                  { type: string }
        access_token_expires_in_sec:    { type: integer, example: 3600 }
        refresh_token_expires_in_sec:   { type: integer, example: 86400 }
        issued_at:                      { type: integer, description: "ms-since-epoch" }
        user:
          type: object
          properties:
            id:    { type: string, format: uuid }
            name:  { type: string }
            email: { type: string, format: email }
        permissions:
          type: array
          items: { type: string }

    LogoutRequest:
      type: object
      properties:
        refresh_token: { type: string }

    RenewRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    RenewResponse:
      type: object
      properties:
        access_token:                { type: string }
        access_token_expires_in_sec: { type: integer }
        issued_at:                   { type: integer }

    CreateTodoRequest:
      type: object
      required: [title]
      properties:
        title:       { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        due_date:    { type: string, format: date-time }

    UpdateTodoRequest:
      type: object
      properties:
        title:       { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        due_date:    { type: string, format: date-time }

    TodoResponse:
      type: object
      properties:
        id:          { type: string, format: uuid }
        title:       { type: string }
        description: { type: string }
        due_date:    { type: string, format: date-time, nullable: true }
        created_at:  { type: string, format: date-time }
        created_by:  { type: string, format: uuid }
        modified_at: { type: string, format: date-time }
        modified_by: { type: string, format: uuid }

  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
