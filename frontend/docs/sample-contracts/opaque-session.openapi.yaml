openapi: 3.0.3
info:
  title: Sample Opaque-Session Auth Contract
  version: 1.0.0
  description: |
    Reference contract for src/services/auth/opaque-session/. Backend
    returns an opaque session_token (e.g. 24h TTL); client cannot decode
    expiry. On 401, client must re-login (no refresh endpoint).

paths:
  /auth/sign-in:
    post:
      summary: Sign in with username + password
      operationId: opaqueSignIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpaqueSignInResponse' }
        '401':
          $ref: '#/components/responses/Error'

  /auth/sign-out:
    post:
      summary: Invalidate current session
      operationId: opaqueSignOut
      responses:
        '200':
          description: Signed out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptySuccess' }

  /auth/change-password:
    post:
      summary: Change password for the current user
      operationId: opaqueChangePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string }
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpaqueChangePasswordResponse' }

components:
  schemas:
    OpaqueSignInResponse:
      type: object
      required: [success, code, data]
      properties:
        success: { type: boolean, example: true }
        code: { type: integer, example: 200 }
        data:
          type: object
          required: [session_token, user, permissions]
          properties:
            session_token: { type: string }
            user:
              type: object
              properties:
                id: { type: string }
                name: { type: string }
                email: { type: string, format: email }
            permissions:
              type: array
              items: { type: string }
            requires_password_change: { type: boolean }
        timestamp: { type: string, format: date-time }

    OpaqueChangePasswordResponse:
      type: object
      required: [success, code, data]
      properties:
        success: { type: boolean, example: true }
        code: { type: integer, example: 200 }
        data:
          type: object
          properties:
            changed_at: { type: string, format: date-time }
        timestamp: { type: string, format: date-time }

    EmptySuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        code: { type: integer, example: 200 }
        data: { type: object }
        timestamp: { type: string, format: date-time }

    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        code: { type: integer, example: 40100 }
        message: { type: string }
        timestamp: { type: string, format: date-time }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
