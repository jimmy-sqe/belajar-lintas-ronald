{{- if .Values.minio.enabled }}
{{- $port        := .Values.minio.port        | default 9000 }}
{{- $consolePort := .Values.minio.consolePort | default 9001 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: {{ include "preview.namespace" . }}
  labels:
    {{- include "preview.labels" . | nindent 4 }}
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: minio
          image: {{ .Values.minio.image | default "minio/minio:latest" }}
          command: ["minio", "server", "/data", "--console-address", ":{{ $consolePort }}"]
          ports:
            - name: api
              containerPort: {{ $port }}
            - name: console
              containerPort: {{ $consolePort }}
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.minio.rootUser | default "minioadmin" | quote }}
            - name: MINIO_ROOT_PASSWORD
              value: {{ .Values.minio.rootPassword | default "minioadmin" | quote }}
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: {{ $port }}
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- if .Values.minio.resources }}
            {{- toYaml .Values.minio.resources | nindent 12 }}
            {{- else }}
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
{{- end }}
