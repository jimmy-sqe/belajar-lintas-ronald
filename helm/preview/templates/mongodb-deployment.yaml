{{- if .Values.mongodb.enabled }}
{{- $port := .Values.mongodb.port | default 27017 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: {{ include "preview.namespace" . }}
  labels:
    {{- include "preview.labels" . | nindent 4 }}
    app: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: mongodb
          image: {{ .Values.mongodb.image | default "mongo:7" }}
          ports:
            - containerPort: {{ $port }}
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: MONGO_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: MONGO_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- if .Values.mongodb.resources }}
            {{- toYaml .Values.mongodb.resources | nindent 12 }}
            {{- else }}
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongodb-data
{{- end }}
