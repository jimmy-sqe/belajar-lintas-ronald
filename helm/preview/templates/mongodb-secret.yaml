{{- if .Values.mongodb.enabled }}
{{- $host     := .Values.mongodb.host     | default "mongodb" }}
{{- $port     := .Values.mongodb.port     | default 27017 }}
{{- $username := .Values.mongodb.username | default "mongo" }}
{{- $password := .Values.mongodb.password | required "mongodb.password is required when mongodb.enabled=true" }}
{{- $database := .Values.mongodb.database | default "preview_db" }}
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
  namespace: {{ include "preview.namespace" . }}
  labels:
    {{- include "preview.labels" . | nindent 4 }}
type: Opaque
stringData:
  MONGO_HOST: {{ $host | quote }}
  MONGO_PORT: {{ $port | toString | quote }}
  MONGO_USERNAME: {{ $username | quote }}
  MONGO_PASSWORD: {{ $password | quote }}
  MONGO_DATABASE: {{ $database | quote }}
  MONGO_URI: {{ printf "mongodb://%s:%s@%s:%d/%s" $username $password $host (int $port) $database | quote }}
{{- end }}
