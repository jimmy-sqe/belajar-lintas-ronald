{{- if .Values.mysql.enabled }}
{{- $port := .Values.mysql.port | default 3306 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: {{ include "preview.namespace" . }}
  labels:
    {{- include "preview.labels" . | nindent 4 }}
    app: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: mysql
          image: {{ .Values.mysql.image | default "mysql:8.0" }}
          ports:
            - containerPort: {{ $port }}
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$(MYSQL_ROOT_PASSWORD)"]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- if .Values.mysql.resources }}
            {{- toYaml .Values.mysql.resources | nindent 12 }}
            {{- else }}
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
{{- end }}
