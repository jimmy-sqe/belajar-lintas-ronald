{{- if .Values.mysql.enabled }}
{{- $host         := .Values.mysql.host         | default "mysql" }}
{{- $port         := .Values.mysql.port         | default 3306 }}
{{- $database     := .Values.mysql.database     | default "preview_db" }}
{{- $username     := .Values.mysql.username     | default "preview_user" }}
{{- $password     := .Values.mysql.password     | required "mysql.password is required when mysql.enabled=true" }}
{{- $rootPassword := .Values.mysql.rootPassword | required "mysql.rootPassword is required when mysql.enabled=true" }}
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: {{ include "preview.namespace" . }}
  labels:
    {{- include "preview.labels" . | nindent 4 }}
type: Opaque
stringData:
  MYSQL_HOST: {{ $host | quote }}
  MYSQL_PORT: {{ $port | toString | quote }}
  MYSQL_USER: {{ $username | quote }}
  MYSQL_PASSWORD: {{ $password | quote }}
  MYSQL_ROOT_PASSWORD: {{ $rootPassword | quote }}
  MYSQL_DATABASE: {{ $database | quote }}
  MYSQL_DSN: {{ printf "%s:%s@tcp(%s:%d)/%s?parseTime=true" $username $password $host (int $port) $database | quote }}
{{- end }}
