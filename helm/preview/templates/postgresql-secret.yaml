apiVersion: v1
kind: Secret
metadata:
  name: postgresql-credentials
  namespace: {{ include "preview.namespace" . }}
  labels:
    {{- include "preview.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_HOST: {{ .Values.postgresql.host | quote }}
  POSTGRES_PORT: {{ .Values.postgresql.port | toString | quote }}
  POSTGRES_USER: {{ .Values.postgresql.username | quote }}
  POSTGRES_PASSWORD: {{ if .Values.postgresql.enabled }}{{ .Values.postgresql.password | required "postgresql.password is required when postgresql.enabled=true" | quote }}{{ else }}{{ .Values.postgresql.password | quote }}{{ end }}
  POSTGRES_DB: {{ .Values.postgresql.database | quote }}
  POSTGRES_SSLMODE: disable
