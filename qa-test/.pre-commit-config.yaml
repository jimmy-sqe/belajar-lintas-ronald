repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic==2.9.0
          - pydantic-settings==2.7.0
          - types-requests==2.32.0.20240914
          - pytest==8.3.3
        files: ^(framework|pages|tests)/
